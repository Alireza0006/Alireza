<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه من</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* این کلاس مستقیماً رفتار اسکرول افقی را مدیریت می‌کند */
        .scroller-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* برای اسکرول نرم در آیفون */
            scrollbar-width: none; /* برای فایرفاکس */
            padding: 0 1rem;
            gap: 1rem;
        }

        .scroller-container::-webkit-scrollbar {
            display: none; /* برای کروم و سافاری */
        }

        .product-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            width: 160px;
            flex: 0 0 auto; /* این باعث می‌شود کارت‌ها فشرده نشوند */
            background-color: white;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold text-indigo-600">فروشگاه من</h1>
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <i class="fa fa-shopping-cart text-xl"></i>
                <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full">0</span>
            </div>
        </div>
    </header>

    <main id="mainContainer" class="container mx-auto py-6"></main>

    <!-- Cart Drawer -->
    <div id="overlay" onclick="toggleCart()" class="hidden fixed inset-0 bg-black/50 z-40"></div>
    <div id="cartDrawer" class="fixed top-0 -right-full h-full w-[85%] md:w-[400px] bg-white shadow-2xl z-50 transition-all duration-300 flex flex-col">
        <div class="p-4 border-b font-bold">سبد خرید شما</div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-4 border-t bg-gray-50">
            <button class="w-full bg-red-500 text-white py-3 rounded-lg font-bold">پرداخت نهایی</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "هدفون حرفه‌ای Pro", category: "الکترونیک", price: 1250000, icon: "fa-headphones" },
            { id: 2, name: "اسپیکر قابل حمل", category: "الکترونیک", price: 850000, icon: "fa-volume-up" },
            { id: 3, name: "موبایل مدل A", category: "الکترونیک", price: 15000000, icon: "fa-mobile-screen" },
            { id: 4, name: "لپ‌تاپ مهندسی", category: "الکترونیک", price: 42000000, icon: "fa-laptop" },
            { id: 5, name: "تبلت ۱۰ اینچی", category: "الکترونیک", price: 9500000, icon: "fa-tablet" },
            { id: 6, name: "ساعت هوشمند X", category: "گجت", price: 2100000, icon: "fa-stopwatch" },
            { id: 7, name: "ماوس بی‌سیم", category: "گجت", price: 450000, icon: "fa-mouse" },
            { id: 8, name: "کیبورد مکانیکی", category: "گجت", price: 1800000, icon: "fa-keyboard" },
            { id: 9, name: "مچ‌بند سلامتی", category: "گجت", price: 750000, icon: "fa-heartbeat" },
            { id: 10, name: "عینک واقعیت مجازی", category: "گجت", price: 3200000, icon: "fa-vr-cardboard" },
            { id: 11, name: "کابل شارژ سریع", category: "اکسسوری", price: 150000, icon: "fa-bolt" },
            { id: 12, name: "پاوربانک ۲۰ هزار", category: "اکسسوری", price: 750000, icon: "fa-battery-full" },
            { id: 13, name: "پد ماوس گیمینگ", category: "اکسسوری", price: 250000, icon: "fa-square" },
            { id: 14, name: "گلس محافظ صفحه", category: "اکسسوری", price: 90000, icon: "fa-shield" },
            { id: 15, name: "استند موبایل", category: "اکسسوری", price: 120000, icon: "fa-mobile" }
        ];

        let cart = [];

        function renderShop() {
            const categories = products.reduce((acc, p) => {
                if (!acc[p.category]) acc[p.category] = [];
                acc[p.category].push(p);
                return acc;
            }, {});

            const container = document.getElementById('mainContainer');
            
            container.innerHTML = Object.keys(categories).map(catName => `
                <div class="mb-8">
                    <h2 class="text-lg font-bold px-4 mb-4 text-gray-800">${catName}</h2>
                    <div class="scroller-container">
                        ${categories[catName].map(p => `
                            <div class="product-card">
                                <div class="w-20 h-20 bg-gray-50 rounded-lg flex items-center justify-center mb-3">
                                    <i class="fa ${p.icon} text-3xl text-gray-400"></i>
                                </div>
                                <h3 class="text-xs font-semibold h-8 overflow-hidden mb-2">${p.name}</h3>
                                <div class="mt-auto w-full">
                                    <p class="text-indigo-600 font-bold text-xs mb-2">${p.price.toLocaleString()} ت</p>
                                    <button onclick="addToCart(${p.id})" class="w-full bg-red-500 text-white py-1 rounded text-[10px] font-bold">افزودن</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) { 
            cart.push(products.find(p => p.id === id)); 
            updateCartUI(); 
        }

        function updateCartUI() {
            document.getElementById('cartItems').innerHTML = cart.map((item, index) => `
                <div class="flex items-center justify-between bg-white p-2 border rounded">
                    <span class="text-sm">${item.name}</span>
                    <button onclick="cart.splice(${index},1); updateCartUI()" class="text-red-500"><i class="fa fa-trash"></i></button>
                </div>
            `).join('');
            document.getElementById('cartBadge').innerText = cart.length;
        }

        function toggleCart() { 
            const d = document.getElementById('cartDrawer');
            d.classList.toggle('-right-full'); 
            d.classList.toggle('right-0');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        window.onload = renderShop;
    </script>
</body>
</html>
