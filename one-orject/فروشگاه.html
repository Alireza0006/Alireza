<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Store | قالب فروشگاهی حرفه‌ای</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #10b981;
            --dark: #0f172a; --light: #f8fafc; --white: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f1f5f9; color: var(--dark); overflow-x: hidden; }
        header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05); }
        nav { max-width: 1300px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .nav-actions { display: flex; align-items: center; gap: 20px; }
        .search-wrapper { position: relative; }
        .search-wrapper input { padding: 10px 40px 10px 15px; border-radius: 30px; border: 1px solid #e2e8f0; outline: none; width: 220px; transition: var(--transition); }
        .search-wrapper input:focus { width: 280px; border-color: var(--primary); }
        .search-wrapper i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .cart-btn { position: relative; cursor: pointer; font-size: 1.4rem; }
        .cart-badge { position: absolute; top: -8px; right: -10px; background: #ef4444; color: white; font-size: 0.7rem; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .hero { height: 300px; background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .main-content { max-width: 1300px; margin: -40px auto 50px; display: grid; grid-template-columns: 280px 1fr; gap: 30px; padding: 0 20px; }
        .sidebar { background: white; padding: 25px; border-radius: 24px; box-shadow: var(--shadow); height: fit-content; }
        .filter-group h4 { margin-bottom: 15px; border-right: 4px solid var(--primary); padding-right: 10px; }
        .filter-item { display: block; padding: 10px; cursor: pointer; border-radius: 10px; text-decoration: none; color: #64748b; transition: var(--transition); }
        .filter-item:hover, .filter-item.active { background: #eef2ff; color: var(--primary); font-weight: bold; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .product-card { background: white; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-10px); }
        .product-img { width: 100%; height: 200px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 4rem; }
        .product-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
        .product-price { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-top: auto; }
        .btn-add { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: 700; cursor: pointer; margin-top: 15px; transition: var(--transition); }
        .cart-drawer { position: fixed; top: 0; left: -100%; width: 380px; height: 100%; background: white; z-index: 2000; box-shadow: 20px 0 50px rgba(0,0,0,0.1); transition: var(--transition); display: flex; flex-direction: column; }
        .cart-drawer.open { left: 0; }
        .cart-header { padding: 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9; }
        .cart-item-icon { font-size: 2rem; background: #f8fafc; padding: 10px; border-radius: 12px; }
        .cart-footer { padding: 25px; background: #f8fafc; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; }
        .btn-checkout { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--secondary); color: white; font-weight: 700; cursor: pointer; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1500; display: none; }
        .overlay.active { display: block; }
        @media (max-width: 992px) { .main-content { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
</head>
<body>
<header>
    <nav>
        <div class="logo" onclick="location.reload()">ULTRA STORE</div>
        <div class="nav-actions">
            <div class="search-wrapper">
                <i class="fa fa-search"></i>
                <input type="text" id="searchInput" placeholder="جستجو..." onkeyup="searchProducts()">
            </div>
            <div class="cart-btn" onclick="toggleCart()">
                <i class="fa fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
        </div>
    </nav>
</header>
<section class="hero">
    <h1>تجربه خرید متفاوت</h1>
    <p>بهترین محصولات با بهترین قیمت</p>
</section>
<div class="main-content">
    <aside class="sidebar">
        <div class="filter-group">
            <h4>دسته‌بندی‌ها</h4>
            <a href="#" class="filter-item active" onclick="filterCategory('همه', this)">همه محصولات</a>
            <a href="#" class="filter-item" onclick="filterCategory('الکترونیک', this)">الکترونیک</a>
            <a href="#" class="filter-item" onclick="filterCategory('گجت', this)">گجت‌ها</a>
            <a href="#" class="filter-item" onclick="filterCategory('اکسسوری', this)">اکسسوری</a>
        </div>
    </aside>
    <main>
        <div class="products-grid" id="productGrid"></div>
    </main>
</div>
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h3>سبد خرید</h3>
        <i class="fa fa-times" style="cursor:pointer" onclick="toggleCart()"></i>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
        <div class="total-row"><span>جمع کل:</span><span id="cartTotal">۰ تومان</span></div>
        <button class="btn-checkout" onclick="alert('در حال اتصال...')">تسویه حساب</button>
    </div>
</div>

<script>
    
    const products = [
        { id: 1, name: "هدفون بی‌سیم Pro", category: "الکترونیک", price: 1250000, icon: "fa-headphones" },
        { id: 2, name: "ساعت هوشمند X", category: "گجت", price: 2100000, icon: "fa-stopwatch" },
        { id: 3, name: "کابل شارژ سریع", category: "اکسسوری", price: 150000, icon: "fa-bolt" },
        { id: 4, name: "اسپیکر بلوتوثی", category: "الکترونیک", price: 850000, icon: "fa-volume-up" },
        { id: 5, name: "ماوس گیمینگ", category: "گجت", price: 450000, icon: "fa-mouse" },
        { id: 6, name: "کیبورد مکانیکی", category: "گجت", price: 1800000, icon: "fa-keyboard" },
        { id: 7, name: "گوشی موبایل مدل A", category: "الکترونیک", price: 15000000, icon: "fa-mobile-screen" },
        { id: 8, name: "پاوربانک ۲۰۰۰۰", category: "اکسسوری", price: 750000, icon: "fa-battery-full" }
    ];

    let cart = [];

    
    function displayProducts(items) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = ''; 

        if (items.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 50px;">محصولی یافت نشد!</p>';
            return;
        }

        items.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-img">
                    <i class="fa ${product.icon}" style="color: var(--primary)"></i>
                </div>
                <div class="product-info">
                    <div class="product-title">${product.name}</div>
                    <div style="color: #94a3b8; font-size: 0.8rem;">${product.category}</div>
                    <div class="product-price">${product.price.toLocaleString()} تومان</div>
                    <button class="btn-add" onclick="addToCart(${product.id})">
                        <i class="fa fa-cart-plus"></i> افزودن به سبد
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    
    function filterCategory(category, element) {
        
        document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        if (category === 'همه') {
            displayProducts(products);
        } else {
            const filtered = products.filter(p => p.category === category);
            displayProducts(filtered);
        }
    }

   
    function searchProducts() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(term));
        displayProducts(filtered);
    }

   
    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        cart.push(product);
        updateCartUI();
        
       
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa fa-check"></i> اضافه شد!';
        btn.style.background = 'var(--secondary)';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = 'var(--primary)';
        }, 1000);
    }

    function toggleCart() {
        document.getElementById('cartDrawer').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }

    function updateCartUI() {
        const cartItemsContainer = document.getElementById('cartItems');
        const cartBadge = document.getElementById('cartBadge');
        const cartTotal = document.getElementById('cartTotal');
        
        cartItemsContainer.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            total += item.price;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div class="cart-item-icon"><i class="fa ${item.icon}"></i></div>
                <div style="flex:1">
                    <div style="font-weight:bold; font-size:0.9rem;">${item.name}</div>
                    <div style="color:var(--primary); font-size:0.8rem;">${item.price.toLocaleString()} تومان</div>
                </div>
                <i class="fa fa-trash" style="color:#ef4444; cursor:pointer" onclick="removeFromCart(${index})"></i>
            `;
            cartItemsContainer.appendChild(div);
        });

        cartBadge.innerText = cart.length;
        cartTotal.innerText = total.toLocaleString() + ' تومان';
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    
    window.onload = () => {
        displayProducts(products);
    };
</script>
</body>
</html>
